worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;
    error_log /var/log/nginx/error.log warn;
    sendfile on;
    keepalive_timeout 90s;

    # Docker's embedded DNS. The resolve parameter below re-resolves the api
    # service when replicas are added or removed, instead of pinning the IPs
    # Nginx saw at startup.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream stocky_api {
        zone stocky_api 64k;
        server api:8080 resolve;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        location = /health {
            proxy_pass http://stocky_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location / {
            proxy_pass http://stocky_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;

            # Retry only idempotent requests on another replica. nginx does not
            # retry POST by default unless non_idempotent is added.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
