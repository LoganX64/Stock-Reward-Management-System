services:
  # =========================
  # PostgreSQL Database
  # =========================
  db:
    image: postgres:17
    container_name: stocky-db
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes: 
      - stocky-db-data:/var/lib/postgresql/data
    ports: 
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocky_user -d stocky"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================
  # Go API (stocky-api)
  # ==========================
  stocky-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stocky-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env.docker
    environment:
      - ENV_FILE=.env.docker
    command: ["./stocky-api"]

volumes:
  stocky-db-data:
    driver: local
